[project]
name = "coursework1"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergey-Molchan",email = "Molchan2025@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ['py310']
exclude = '''
\.git
'''

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["src"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv/"